name: Evaluation protocol tests

on:
  push:
    paths:
      - "eval/**"
      - "tests/**"
      - "Usisivac/src/agents/target_encoding.py"
      - ".github/workflows/evaluation-tests.yml"
  pull_request:
    paths:
      - "eval/**"
      - "tests/**"
      - "Usisivac/src/agents/target_encoding.py"
      - ".github/workflows/evaluation-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade numpy pandas scipy scikit-learn pytest
      - name: Run evaluation tests
        run: python -m pytest -q
